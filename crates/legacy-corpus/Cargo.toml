[package]
name = "photocraft-legacy-corpus"
description = "The legacy plug-in corpus: WebAssembly modules, documents, an action and preferences generated from today's code, with the parity tests that load them"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "legacy-corpus"
path = "src/main.rs"

[dependencies]
photocraft-doc = { workspace = true }
photocraft-engine = { workspace = true }
photocraft-format = { workspace = true }
photocraft-plugins = { workspace = true }
craft-testkit = { workspace = true, features = ["corpus"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1"
wat = "1.228"

[dev-dependencies]
tempfile = "3"
